<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="80" fill="url(#g)"/>
  <rect width="512" height="512" rx="80" fill="url(#glow)"/>

  <g stroke="#334155" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M96 420 H240 V360 H380"/>
    <path d="M132 92 H250 V150 H400"/>
    <path d="M416 96 V180 H330 V260"/>
  </g>
  <g fill="#38BDF8" opacity="0.85">
    <circle cx="240" cy="360" r="4"/><circle cx="380" cy="360" r="4"/>
    <circle cx="250" cy="150" r="4"/><circle cx="400" cy="150" r="4"/>
    <circle cx="330" cy="180" r="4"/><circle cx="330" cy="260" r="4"/>
  </g>

  <!-- Hexagon frame -->
  <path d="M256 96 L372 150 L372 262 L256 416 L140 262 L140 150 Z"
        fill="none" stroke="url(#a)" stroke-width="6" opacity="0.9"/>

  <!-- Monogram JG -->
  <text x="256" y="268" text-anchor="middle" dominant-baseline="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="170" font-weight="800"
        fill="url(#a)" letter-spacing="-6">JG</text>

  <!-- Node pulse -->
  <circle cx="140" cy="150" r="16" fill="#38BDF8" opacity="0.15"/>
  <circle cx="140" cy="150" r="6" fill="#38BDF8"/>
  <circle cx="372" cy="262" r="16" fill="#7C3AED" opacity="0.15"/>
  <circle cx="372" cy="262" r="6" fill="#7C3AED"/>
</svg>