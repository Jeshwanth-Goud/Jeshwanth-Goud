<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.3" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1E293B" stroke-width="0.6"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blurS" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)" opacity="0.5"/>
  <rect width="1500" height="500" fill="url(#glow)"/>
  <rect width="1500" height="500" fill="url(#glow2)"/>

  <!-- Circuit traces -->
  <g stroke="#7C3AED" stroke-width="1.4" fill="none" opacity="0.5">
    <path d="M60 420 H210 V360 H360"/>
    <path d="M1320 140 H1250 V210 H1120"/>
    <path d="M1380 60 V120 H1280 V180"/>
    <path d="M90 460 H280 V400 H430"/>
    <path d="M1080 400 H1180 V340 H1330"/>
    <path d="M1240 60 H1180 V110 H1030"/>
  </g>
  <g fill="#38BDF8" filter="url(#soft)">
    <circle cx="210" cy="360" r="3"/><circle cx="360" cy="360" r="3"/>
    <circle cx="1250" cy="210" r="3"/><circle cx="1120" cy="210" r="3"/>
    <circle cx="1280" cy="120" r="3"/><circle cx="1280" cy="300" r="3"/>
    <circle cx="280" cy="400" r="3"/><circle cx="1260" cy="410" r="3"/>
  </g>

  <!-- Neural network cluster left -->
  <g stroke="#38BDF8" stroke-width="1" opacity="0.35" fill="none">
    <line x1="180" y1="60" x2="260" y2="130"/>
    <line x1="180" y1="60" x2="230" y2="165"/>
    <line x1="260" y1="130" x2="230" y2="165"/>
    <line x1="260" y1="130" x2="240" y2="200"/>
    <line x1="120" y1="90" x2="260" y2="130"/>
    <line x1="300" y1="70" x2="260" y2="130"/>
  </g>
  <g fill="#38BDF8" opacity="0.85">
    <circle cx="180" cy="60" r="5"/><circle cx="260" cy="130" r="5"/>
    <circle cx="230" cy="165" r="4"/><circle cx="240" cy="200" r="4"/>
    <circle cx="120" cy="90" r="4"/><circle cx="300" cy="70" r="4"/>
    <circle cx="230" cy="165" r="8" fill="#38BDF8" opacity="0.2"/>
  </g>

  <!-- Neural network cluster right -->
  <g stroke="#7C3AED" stroke-width="1" opacity="0.4" fill="none">
    <line x1="1320" y1="380" x2="1240" y2="430"/>
    <line x1="1320" y1="380" x2="1370" y2="450"/>
    <line x1="1240" y1="430" x2="1370" y2="450"/>
    <line x1="1240" y1="430" x2="1270" y2="470"/>
    <line x1="1410" y1="360" x2="1320" y2="380"/>
    <line x1="1400" y1="420" x2="1370" y2="450"/>
  </g>
  <g fill="#7C3AED" opacity="0.9">
    <circle cx="1320" cy="380" r="5"/><circle cx="1240" cy="430" r="5"/>
    <circle cx="1370" cy="450" r="4"/><circle cx="1270" cy="470" r="4"/>
    <circle cx="1410" cy="360" r="4"/><circle cx="1400" cy="420" r="4"/>
  </g>

  <!-- Badge chip -->
  <g>
    <rect x="685" y="118" width="130" height="34" rx="17" fill="#1E293B" stroke="url(#accent)" stroke-width="1"/>
    <text x="750" y="141" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#38BDF8" text-anchor="middle">&lt;/&gt; ENGINEER</text>
  </g>

  <!-- Title -->
  <text x="750" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="4" fill="url(#titleGrad)">JESHWANTH GOUD</text>

  <!-- Role pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600">
    <g><rect x="244" y="258" width="150" height="30" rx="15" fill="#0F172A" stroke="#334155"/><text x="319" y="278" text-anchor="middle" fill="#E2E8F0">Software Engineer</text></g>
    <g><rect x="406" y="258" width="130" height="30" rx="15" fill="#0F172A" stroke="#334155"/><text x="471" y="278" text-anchor="middle" fill="#38BDF8">AI / ML Engineer</text></g>
    <g><rect x="548" y="258" width="130" height="30" rx="15" fill="#0F172A" stroke="#334155"/><text x="613" y="278" text-anchor="middle" fill="#7C3AED">Full Stack Dev</text></g>
    <g><rect x="690" y="258" width="120" height="30" rx="15" fill="#0F172A" stroke="#334155"/><text x="750" y="278" text-anchor="middle" fill="#E2E8F0">Cloud</text></g>
    <g><rect x="822" y="258" width="120" height="30" rx="15" fill="#0F172A" stroke="#334155"/><text x="882" y="278" text-anchor="middle" fill="#38BDF8">Java</text></g>
    <g><rect x="954" y="258" width="150" height="30" rx="15" fill="#0F172A" stroke="#334155"/><text x="1029" y="278" text-anchor="middle" fill="#7C3AED">Open Source</text></g>
    <g><rect x="1116" y="258" width="140" height="30" rx="15" fill="#0F172A" stroke="#334155"/><text x="1186" y="278" text-anchor="middle" fill="#E2E8F0">Problem Solver</text></g>
  </g>

  <!-- Accent underline -->
  <g filter="url(#blurS)">
    <rect x="550" y="470" width="400" height="3" rx="1.5" fill="url(#accent)"/>
  </g>
  <rect x="550" y="470" width="400" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Tech chips bottom -->
  <g font-family="'Consolas','Courier New',monospace" font-size="13" fill="#94A3B8" opacity="0.9">
    <text x="60" y="50">$ _ git commit --brand="ai-engineer"</text>
  </g>
</svg>